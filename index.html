<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Snoopy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <!-- Ilustración / Imagen decorativa de Snoopy -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSVaQ7LsPOK9ZoJEDvSPVj7SjjxhaNrZHW9unXsG5By--isL5XphVlDXQ-1aJCLYHEK7pbi_JvZstd6OuuDo3vOvIa2SCobcdLWvbBij_Cgw&s=10" alt="Snoopy" class="snoopy-img">
      <h2>Snoopy Calc 🐾</h2>
    </div>

    <!-- Pantalla de la calculadora -->
    <input type="text" id="display" readonly placeholder="0">

    <!-- Teclado de botones -->
    <div class="buttons">
      <button class="btn btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn btn-op" onclick="appendCharacter('/')">÷</button>
      <button class="btn btn-op" onclick="appendCharacter('*')">×</button>
      <button class="btn btn-op" onclick="deleteLast()">⌫</button>

      <button class="btn" onclick="appendCharacter('7')">7</button>
      <button class="btn" onclick="appendCharacter('8')">8</button>
      <button class="btn" onclick="appendCharacter('9')">9</button>
      <button class="btn btn-op" onclick="appendCharacter('-')">-</button>

      <button class="btn" onclick="appendCharacter('4')">4</button>
      <button class="btn" onclick="appendCharacter('5')">5</button>
      <button class="btn" onclick="appendCharacter('6')">6</button>
      <button class="btn btn-op" onclick="appendCharacter('+')">+</button>

      <button class="btn" onclick="appendCharacter('1')">1</button>
      <button class="btn" onclick="appendCharacter('2')">2</button>
      <button class="btn" onclick="appendCharacter('3')">3</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>

      <button class="btn btn-zero" onclick="appendCharacter('0')">0</button>
      <button class="btn" onclick="appendCharacter('.')">.</button>
    </div>
    
    <div class="footer-decor">🐾 🐾 🐾</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
